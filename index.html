<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selim Portfolio</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      line-height: 1.6;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      padding: 60px 0;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      flex-wrap: wrap;
    }

    .hero-text {
      flex: 1;
    }

    .hero h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 20px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag {
      background: #222;
      padding: 10px 15px;
      border-radius: 30px;
      border: 1px solid #333;
    }

    .hero-image img {
      width: 320px;
      border-radius: 20px;
      object-fit: cover;
    }

    .section {
      margin-top: 80px;
    }

    .section h2 {
      margin-bottom: 20px;
      font-size: 40px;
    }

    .admin-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: black;
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 50px;
      cursor: pointer;
      z-index: 9999;
    }

    .admin-panel {
      position: fixed;
      top: 0;
      right: -450px;
      width: 450px;
      height: 100vh;
      background: white;
      color: black;
      padding: 30px;
      overflow-y: auto;
      transition: 0.3s;
      z-index: 99999;
    }

    .admin-panel.active {
      right: 0;
    }

    .admin-panel input,
    .admin-panel textarea {
      width: 100%;
      margin-bottom: 20px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .admin-panel button {
      background: black;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    @media(max-width:768px){

      .hero {
        flex-direction: column;
      }

      .hero h1 {
        font-size: 40px;
      }

      .admin-panel {
        width: 100%;
      }

    }

  </style>
</head>
<body>

  <button class="admin-button" onclick="openAdmin()">
    ⚙ Admin
  </button>

  <div class="admin-panel" id="adminPanel">

    <h2>Edit Website</h2>

    <input type="text" id="editName" placeholder="Your Name">

    <input type="text" id="editTitle" placeholder="Your Title">

    <textarea id="editDescription" rows="5" placeholder="Description"></textarea>

    <input type="text" id="editTags" placeholder="Tags separated by commas">

    <input type="text" id="editImage" placeholder="Image URL">

    <button onclick="saveContent()">Save Changes</button>

  </div>

  <div class="container">

    <section class="hero">

      <div class="hero-text">

        <h1 id="name"></h1>

        <p id="title"></p>

        <p id="description"></p>

        <div class="tags" id="tags"></div>

      </div>

      <div class="hero-image">
        <img id="profileImage" src="" alt="Profile">
      </div>

    </section>

    <section class="section">
      <h2>About Me</h2>
      <p>
        I help brands grow through SEO content, strategy, and conversion-focused writing.
      </p>
    </section>

  </div>

  <script>

    const defaultData = {
      name: "Selim Hadj Brahim",
      title: "Content Strategist & SEO Writer",
      description: "I write content that ranks, converts, and builds trust.",
      tags: [
        "SEO",
        "Content Writing",
        "Strategy",
        "Lead Generation"
      ],
      image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1200&auto=format&fit=crop"
    };

    let websiteData = JSON.parse(localStorage.getItem('portfolioData')) || defaultData;

    function renderWebsite() {

      document.getElementById('name').innerText = websiteData.name;

      document.getElementById('title').innerText = websiteData.title;

      document.getElementById('description').innerText = websiteData.description;

      document.getElementById('profileImage').src = websiteData.image;

      const tagsContainer = document.getElementById('tags');

      tagsContainer.innerHTML = '';

      websiteData.tags.forEach(tag => {

        tagsContainer.innerHTML += `
          <div class="tag">${tag}</div>
        `;

      });

    }

    function openAdmin() {

      const password = prompt('Enter admin password');

      if(password !== 'admin123') {
        alert('Wrong password');
        return;
      }

      document.getElementById('adminPanel').classList.add('active');

      document.getElementById('editName').value = websiteData.name;

      document.getElementById('editTitle').value = websiteData.title;

      document.getElementById('editDescription').value = websiteData.description;

      document.getElementById('editTags').value = websiteData.tags.join(', ');

      document.getElementById('editImage').value = websiteData.image;

    }

    function saveContent() {

      websiteData.name = document.getElementById('editName').value;

      websiteData.title = document.getElementById('editTitle').value;

      websiteData.description = document.getElementById('editDescription').value;

      websiteData.tags = document.getElementById('editTags').value.split(',');

      websiteData.image = document.getElementById('editImage').value;

      localStorage.setItem('portfolioData', JSON.stringify(websiteData));

      renderWebsite();

      alert('Changes Saved');

    }

    renderWebsite();

  </script>

</body>
</html>
